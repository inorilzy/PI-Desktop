name: Issue 914 isolated validation
on:
  push:
    branches: [feat/session-collaboration-active-turn-914]
    paths: [.github/workflows/issue-914-validation.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare integrated candidate
        run: |
          mkdir -p /tmp/issue914
          original=$(git rev-parse HEAD)
          git config user.name 'Liu Zhiyu'
          git config user.email '30362354+inorilzy@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/adr/session-collaboration-current-turn.md')
          s = p.read_text().replace('# ADR: Opt-in current-turn session collaboration', '# ADR session-collaboration-current-turn: Opt-in current-turn session collaboration')
          s = s.replace('## Context and alternatives', '## Context').replace('## Compatibility, safety, and consequences', '## Consequences')
          p.write_text(s)
          p = Path('docs/adr/README.md')
          if '| session-collaboration-current-turn |' not in p.read_text():
              p.write_text(p.read_text() + '| session-collaboration-current-turn | [Opt-in current-turn session collaboration](session-collaboration-current-turn.md) | Proposed |\n')
          p = Path('crates/host-core/src/sessions.rs')
          s = p.read_text()
          old = '    let collaboration_replay = record\n        .meta\n        .as_ref()\n        .is_some_and(|meta| meta.get("sessionMessage").is_some())'
          new = '    let collaboration_replay = record.id.starts_with("session-message:")\n        && record\n            .meta\n            .as_ref()\n            .is_some_and(|meta| meta.get("sessionMessage").is_some())'
          assert old in s or new in s
          p.write_text(s.replace(old, new))
          PY
          rustfmt --edition 2021 --config skip_children=true crates/host-core/src/sessions.rs
          git add -- docs/adr/session-collaboration-current-turn.md docs/adr/README.md crates/host-core/src/sessions.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: scope receipt recovery to current-turn transcript IDs' -m 'Keep ordinary queue transcript appends on their existing path and register the current-turn ADR in the documentation catalog.' -m 'Refs #914'
          fi
          git fetch --no-tags https://github.com/vastsa/PI-Desktop.git main:refs/remotes/upstream/main
          git merge --no-edit upstream/main
          node scripts/check-pr-base-main.mjs --base upstream/main
          git rev-parse upstream/main | tee /tmp/issue914/base.sha
          git rev-parse HEAD | tee /tmp/issue914/candidate.sha
          git rev-parse upstream/main:.github/workflows | tee /tmp/issue914/upstream-workflows.sha
          git diff upstream/main HEAD --binary -- . ':!.github/workflows/issue-914-validation.yml' ':!.github/issue914-patch' > /tmp/issue914/candidate.patch
          # The Actions token cannot publish workflow changes inherited from
          # upstream. Export product-source objects only, leaving the actual
          # integrated HEAD/worktree intact for every validation step below.
          export_index="$RUNNER_TEMP/issue914-export-index"
          GIT_INDEX_FILE="$export_index" git read-tree HEAD
          GIT_INDEX_FILE="$export_index" git restore --source="$original" --staged -- .github/workflows
          export_tree=$(GIT_INDEX_FILE="$export_index" git write-tree)
          export_commit=$(git commit-tree "$export_tree" -p "$original" -m 'test: export integrated issue 914 product source' -m 'Validation runs on the full latest-main integration candidate; publish no workflow changes using the Actions token.' -m 'Refs #914')
          git diff --exit-code HEAD "$export_commit" -- . ':!.github/workflows'
          git push origin "$export_commit":feat/session-collaboration-active-turn-914
          echo "$export_commit" | tee /tmp/issue914/export.sha
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked JS dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile 2>&1 | tee /tmp/issue914/install.log
      - name: Architecture and documentation gates
        id: architecture
        continue-on-error: true
        run: |
          node scripts/check-architecture.mjs --base upstream/main 2>&1 | tee /tmp/issue914/architecture.log
          node docs/scripts/check-docs.mjs 2>&1 | tee /tmp/issue914/docs.log
          node docs/scripts/check-locales.mjs 2>&1 | tee /tmp/issue914/docs-locales.log
          git diff --check upstream/main HEAD
      - name: Build JS workspace, typecheck and lint
        id: js
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm build:js 2>&1 | tee /tmp/issue914/js-build.log
          pnpm --filter @pi-desktop/desktop typecheck 2>&1 | tee /tmp/issue914/typecheck.log
          pnpm lint 2>&1 | tee /tmp/issue914/lint.log
      - name: Workspace regression tests
        id: unit
        if: steps.js.outcome == 'success'
        continue-on-error: true
        run: pnpm -r --if-present test 2>&1 | tee /tmp/issue914/workspace-tests.log
      - name: Rust format, lint and regression tests
        id: rust
        continue-on-error: true
        run: |
          cargo fmt --check 2>&1 | tee /tmp/issue914/rust-fmt.log
          cargo clippy -p host-core --all-targets --locked 2>&1 | tee /tmp/issue914/rust-clippy.log
          cargo test -p host-core --locked 2>&1 | tee /tmp/issue914/rust-tests.log
      - name: Build isolated host
        id: hostbuild
        continue-on-error: true
        run: cargo build -p host-core --locked 2>&1 | tee /tmp/issue914/host-build.log
      - name: Real Host and sidecar integration
        id: e2e
        if: steps.js.outcome == 'success' && steps.hostbuild.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm test:e2e:collaboration 2>&1 | tee /tmp/issue914/collaboration-e2e.log
          pnpm test:e2e:session-completion 2>&1 | tee /tmp/issue914/completion-e2e.log
          pnpm test:e2e:session-current-turn 2>&1 | tee /tmp/issue914/current-turn-e2e.log
      - name: Export evidence
        if: always()
        run: |
          echo '${{ toJSON(steps) }}' > /tmp/issue914/steps.json
          git archive --format=tar HEAD > /tmp/issue914/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue914-validation
          path: /tmp/issue914
          retention-days: 2
      - name: Enforce gates
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.architecture.outcome }}' = success
          test '${{ steps.js.outcome }}' = success
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.rust.outcome }}' = success
          test '${{ steps.hostbuild.outcome }}' = success
          test '${{ steps.e2e.outcome }}' = success
