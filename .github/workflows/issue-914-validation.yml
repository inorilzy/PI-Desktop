name: Issue 914 isolated validation
on:
  push:
    branches: [feat/session-collaboration-active-turn-914]
    paths: [.github/workflows/issue-914-validation.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct validation findings
        run: |
          mkdir -p /tmp/issue914
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  assert new in text, path
                  return
              assert text.count(old) == 1, (path, text.count(old))
              p.write_text(text.replace(old, new))
          replace('apps/desktop/src/lib/api.ts', '{ errorCode: ErrorCodes.INVALID_PARAMS }', '{ errorCode: "INVALID_PARAMS" }')
          replace('apps/desktop/electron/main/index.ts', 'const eventPersistence = createEventPersistence({', 'const { persistAgentEvent } = createEventPersistence({')
          p = Path('apps/desktop/electron/main/index.ts')
          p.write_text(p.read_text().replace('const { persistAgentEvent } = eventPersistence;\n', ''))
          replace('packages/agent-runtime/src/runtime.ts', 'formatSessionMessage(message.content, message.sessionMessage!)', 'formatSessionMessage(message.content, message.sessionMessage)')
          replace('packages/agent-runtime/src/runtime.ts', '      if (this.contextBudget(messages).tokens >= this.contextBudget(messages).hardLimit) {', '      const budget = this.contextBudget(messages);\n      if (budget.tokens >= budget.hardLimit) {')
          replace('scripts/e2e-session-current-turn.mjs', '''  const first = requests.length === 1;
            const delta = first ? {
              role: "assistant", content: "Waiting for worker09.",
              tool_calls: [{ index: 0, id: "wait09", type: "function", function: { name: toolName, arguments: "{}" } }],
            } : { role: "assistant", content: "Used worker08's result while worker09 continues." };''', '''  // Follow the actual ToolSearch activation contract; deferred plugin tools
            // cannot execute until they are exposed on the following model request.
            const toolCall = requests.length === 1
              ? { name: "ToolSearch", arguments: JSON.stringify({ query: toolName }) }
              : requests.length === 2 ? { name: toolName, arguments: "{}" } : undefined;
            const delta = toolCall ? {
              role: "assistant", content: "Waiting for worker09.",
              tool_calls: [{ index: 0, id: `wait09-${requests.length}`, type: "function", function: toolCall }],
            } : { role: "assistant", content: "Used worker08's result while worker09 continues." };''')
          replace('scripts/e2e-session-current-turn.mjs', 'finish_reason: first ? "tool_calls" : "stop"', 'finish_reason: toolCall ? "tool_calls" : "stop"')
          replace('scripts/e2e-session-current-turn.mjs', '''  sidecar.setLocalTool(toolName, async ({ signal }) => {
              signal.addEventListener("abort", () => { waitAborted = true; }, { once: true });
              entered.resolve();
              await release.promise;
              return { ok: true, content: "Worker09 is still running; its status-poll interval ended.", isError: false };
            });''', '''  sidecar.setLocalTool(toolName, async ({ signal }) => {
              const onAbort = () => { waitAborted = true; };
              signal.addEventListener("abort", onAbort, { once: true });
              try {
                entered.resolve();
                await release.promise;
                return { ok: true, content: "Worker09 is still running; its status-poll interval ended.", isError: false };
              } finally {
                // AgentSidecar aborts its controller during normal cleanup as well.
                // Count only an interruption while this tool was still executing.
                signal.removeEventListener("abort", onAbort);
              }
            });''')
          replace('scripts/e2e-session-current-turn.mjs', 'assert.equal(requests.length, 1, "arrival neither interrupts', 'assert.equal(requests.length, 2, "arrival neither interrupts')
          replace('scripts/e2e-session-current-turn.mjs', 'assert.equal(requests.length, 2, JSON.stringify(requests));', 'assert.equal(requests.length, 3, JSON.stringify(requests));')
          replace('scripts/e2e-session-current-turn.mjs', 'const secondInputs = requests[1].messages.filter', 'const secondInputs = requests[2].messages.filter')
          replace('scripts/e2e-session-current-turn.mjs', '''} finally {
            release.resolve();''', '''} catch (error) {
            console.error("Current-turn fixture failure", {
              requests: requests.length, events: events.map((e) => e.event), runtimeStderr,
            });
            throw error;
          } finally {
            release.resolve();''')
          PY
          git add -- apps/desktop/src/lib/api.ts apps/desktop/electron/main/index.ts packages/agent-runtime/src/runtime.ts scripts/e2e-session-current-turn.mjs
          git config user.name 'Liu Zhiyu'
          git config user.email '30362354+inorilzy@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'test: exercise collaboration with activated on-demand tools' -m 'Fix strict settings validation and keep composition within its architecture limit. Test the real deferred plugin-tool activation contract and distinguish cleanup from interruption.' -m 'Refs #914'
            git push origin HEAD:feat/session-collaboration-active-turn-914
          fi
          git rev-parse HEAD | tee /tmp/issue914/candidate.sha
          git diff 454715877750b4f944cc7b621432ea9bd461f321 HEAD --binary -- . ':!.github/workflows/issue-914-validation.yml' ':!.github/issue914-patch' > /tmp/issue914/candidate.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked JS dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile 2>&1 | tee /tmp/issue914/install.log
      - name: Architecture and style gates
        id: architecture
        continue-on-error: true
        run: |
          node scripts/check-architecture.mjs --base 454715877750b4f944cc7b621432ea9bd461f321 2>&1 | tee /tmp/issue914/architecture.log
          node scripts/check-style-tokens.mjs 2>&1 | tee /tmp/issue914/style.log
          git diff --check 454715877750b4f944cc7b621432ea9bd461f321 HEAD
      - name: Build JS dependencies and typecheck desktop
        id: js
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm --filter '@pi-desktop/desktop^...' build 2>&1 | tee /tmp/issue914/js-build.log
          pnpm --filter @pi-desktop/desktop typecheck 2>&1 | tee /tmp/issue914/typecheck.log
      - name: Full runtime and Main regression tests
        id: unit
        if: steps.js.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm --filter @pi-desktop/agent-runtime test 2>&1 | tee /tmp/issue914/runtime-tests.log
          pnpm --filter @pi-desktop/host-runtime test 2>&1 | tee /tmp/issue914/host-runtime-tests.log
          node --test apps/desktop/test/session-collaboration-service.test.mjs apps/desktop/test/session-collaboration-ipc.test.mjs 2>&1 | tee /tmp/issue914/main-tests.log
      - name: Rust host regression tests
        id: rust
        continue-on-error: true
        run: cargo test -p host-core --locked 2>&1 | tee /tmp/issue914/rust-tests.log
      - name: Build isolated host
        id: hostbuild
        continue-on-error: true
        run: cargo build -p host-core --locked 2>&1 | tee /tmp/issue914/host-build.log
      - name: Real Host and sidecar integration
        id: e2e
        if: steps.js.outcome == 'success' && steps.hostbuild.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm test:e2e:collaboration 2>&1 | tee /tmp/issue914/collaboration-e2e.log
          pnpm test:e2e:session-completion 2>&1 | tee /tmp/issue914/completion-e2e.log
          pnpm test:e2e:session-current-turn 2>&1 | tee /tmp/issue914/current-turn-e2e.log
      - name: Export evidence
        if: always()
        run: |
          echo '${{ toJSON(steps) }}' > /tmp/issue914/steps.json
          git archive --format=tar HEAD > /tmp/issue914/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue914-validation
          path: /tmp/issue914
          retention-days: 2
      - name: Enforce gates
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.architecture.outcome }}' = success
          test '${{ steps.js.outcome }}' = success
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.rust.outcome }}' = success
          test '${{ steps.hostbuild.outcome }}' = success
          test '${{ steps.e2e.outcome }}' = success
