name: Session reference migration workspace
on:
  push:
    branches: [work/447-slot-migration]
    paths: [.github/workflows/session-reference-migration-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public source revisions for the migration
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init workspace
          cd workspace
          git remote add upstream https://github.com/vastsa/PI-Desktop.git
          git fetch --depth=32 upstream main:refs/heads/source-main feat/528-plugin-slots:refs/heads/source-slots refs/pull/447/head:refs/heads/source-pr447
          git checkout source-main
          git log -1 --format='%H %s' source-main
          git log -1 --format='%H %s' source-slots
          git log -1 --format='%H %s' source-pr447
          cd ..
          tar -czf workspace.tar.gz workspace
      - uses: actions/upload-artifact@v4
        with:
          name: session-reference-migration-source
          path: workspace.tar.gz
          retention-days: 1
