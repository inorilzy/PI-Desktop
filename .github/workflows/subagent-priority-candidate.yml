name: Subagent priority candidate
on:
  push:
    branches: [fix/subagent-pinned-model-priority]
    paths: [.github/workflows/subagent-priority-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'inorilzy/PI-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare isolated request worktree and verify patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/subagent-pinned-model-priority
          mkdir -p "$RUNNER_TEMP/evidence"
          cp .github/subagent-priority.patch.b64 "$RUNNER_TEMP/evidence/transport.b64"
          git config user.name inorilzy
          git config user.email 30362354+inorilzy@users.noreply.github.com
          git remote rename origin fork
          git remote add origin https://github.com/vastsa/PI-Desktop.git
          git worktree add --detach "$RUNNER_TEMP/subagent-priority" HEAD
          cd "$RUNNER_TEMP/subagent-priority"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('.github/subagent-priority.patch.b64').read_text().strip()
          for old, new in [
              ('crhgWWdk', 'crhgWdk'), ('6jnVQQ47', '6jnVQ47'),
              ('bh09SSSP', 'bh09SSP'), ('N2NEE2y', 'N2NE2y'),
              ('pIzCC7wp', 'pIzC7wp'), ('akUXWWiu', 'akUXWiu'),
              ('kWQUUaY', 'kWQUaY'), ('fSEEUQ1', 'fSEUQ1'),
          ]:
              encoded = encoded.replace(old, new)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '26b9e1aab13ca6966982ba639df99b83f1afc592552311fdf1b83d8b367b30bd'
          Path(os.environ['RUNNER_TEMP'], 'candidate.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --include=packages/agent-runtime/src/runtime.test.ts --include=scripts/e2e-subagent-models.mjs "$RUNNER_TEMP/candidate.patch"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install clean CI dependencies and build the baseline
        run: |
          cd "$RUNNER_TEMP/subagent-priority"
          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/agent-runtime...' build
      - name: Confirm the old priority fails the new regression tests
        run: |
          set +e
          set -uo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          pnpm --filter @pi-desktop/agent-runtime exec vitest run src/runtime.test.ts -t 'keeps the definition pin|does not bypass an unresolved definition pin|still accepts an opted-in' --reporter=json --outputFile="$RUNNER_TEMP/evidence/baseline.json"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path(os.environ['RUNNER_TEMP'], 'evidence/baseline.json').read_text())
          print('BASELINE:', result['numFailedTests'], 'failed;', result['numPassedTests'], 'passed')
          assert result['numFailedTests'] == 7 and result['numPassedTests'] == 1
          PY
      - name: Apply reviewed implementation and incorporate latest upstream
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          git apply --exclude=packages/agent-runtime/src/runtime.test.ts --exclude=scripts/e2e-subagent-models.mjs "$RUNNER_TEMP/candidate.patch"
          git diff --check
          git add packages/agent-runtime/src/runtime.ts packages/agent-runtime/src/runtime.test.ts scripts/e2e-subagent-models.mjs docs/adr/README.md docs/adr/subagent-model-fallback.md docs/adr/subagent-model-opt-in.md docs/adr/subagent-pinned-model-priority.md docs/spec/03-runtime/02-agent-runtime.md docs/spec/03-runtime/11-provider-model-system.md docs/spec/06-delivery/04-e2e-test-plan.md docs/spec/08-meta/decisions-log.md docs/zh-CN/spec/03-runtime/02-agent-runtime.md docs/zh-CN/spec/03-runtime/11-provider-model-system.md docs/zh-CN/spec/06-delivery/04-e2e-test-plan.md docs/zh-CN/spec/08-meta/decisions-log.md
          git commit -m 'fix(subagents): prioritize configured models over AI selection'
          git fetch origin main
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD
          pnpm check:pr-base
          git rev-parse HEAD origin/main | tee "$RUNNER_TEMP/evidence/revisions.txt"
      - name: Build and run runtime selection, fallback, and resume regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          pnpm --filter '@pi-desktop/agent-runtime...' build
          pnpm --filter @pi-desktop/agent-runtime exec vitest run src/runtime.test.ts src/subagent.test.ts src/subagent-fallback.test.ts src/subagent-definitions.test.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/evidence/runtime.log"
      - name: Verify actual sidecar model requests and ordered fallback
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          pnpm test:e2e:subagent-models 2>&1 | tee "$RUNNER_TEMP/evidence/sidecar.log"
      - name: Validate documentation, lint, and architecture
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          pnpm docs:check
          pnpm lint
          ARCHITECTURE_BASE=origin/main node scripts/check-architecture.mjs
          git diff --check
          git status --short
      - name: Publish only the validated request branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/subagent-priority"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff origin/main --stat
          git push fork HEAD:refs/heads/fix/subagent-pinned-model-priority
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subagent-priority-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 3
